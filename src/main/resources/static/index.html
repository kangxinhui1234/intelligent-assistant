<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能投研多智能体平台</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4eb;
            --text-dim: #8b8fa3;
            --accent: #4f8fff;
            --green: #34d399;
            --yellow: #fbbf24;
            --red: #f87171;
            --purple: #a78bfa;
            --orange: #fb923c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 240px; background: var(--card); border-right: 1px solid var(--border);
            padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;
        }
        .sidebar h2 { font-size: 14px; font-weight: 600; padding: 0 8px 14px; letter-spacing: .3px; }
        .sidebar .agent-item {
            padding: 9px 10px; border-radius: 7px; cursor: pointer;
            font-size: 13px; color: var(--text-dim); transition: all .15s;
            display: flex; align-items: center; gap: 8px;
        }
        .sidebar .agent-item:hover { background: #22252f; color: var(--text); }
        .sidebar .agent-item.active { background: rgba(79,143,255,.12); color: var(--accent); font-weight: 500; }
        .sidebar .dot { width: 7px; height: 7px; border-radius: 50%; }
        .sidebar .dot.general { background: var(--accent); }
        .sidebar .dot.invest { background: var(--green); }
        .sidebar .dot.report { background: var(--purple); }
        .sidebar .badge { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 10px;
            background: rgba(79,143,255,.15); color: var(--accent); }
        .sidebar .footer { margin-top: auto; padding: 14px 8px 0; font-size: 11px;
            color: var(--text-dim); border-top: 1px solid var(--border); }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .header { padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 15px; font-weight: 600; }
        .header .subtitle { font-size: 12px; color: var(--text-dim); }

        .input-area { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
        .input-area input {
            flex: 1; padding: 9px 12px; background: var(--card); border: 1px solid var(--border);
            border-radius: 7px; color: var(--text); font-size: 13px; outline: none;
        }
        .input-area input:focus { border-color: var(--accent); }
        .input-area input::placeholder { color: var(--text-dim); }
        .btn {
            padding: 9px 16px; border-radius: 7px; border: none; font-size: 12px;
            font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #3a6fd8; }
        .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { background: transparent; border: 1px solid rgba(248,113,113,.3); color: var(--red); }
        .btn-danger:hover { background: rgba(248,113,113,.1); }

        .body-wrap { flex: 1; display: flex; overflow: hidden; }

        /* Agent Topology */
        .topo-panel {
            width: 280px; border-right: 1px solid var(--border); padding: 16px;
            overflow-y: auto; flex-shrink: 0;
        }
        .topo-panel h3 { font-size: 12px; font-weight: 600; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
        .topo-stage { margin-bottom: 14px; }
        .topo-stage-label {
            font-size: 10px; color: var(--text-dim); margin-bottom: 6px;
            padding: 2px 8px; background: rgba(139,143,163,.08); border-radius: 4px; display: inline-block;
        }
        .topo-node {
            display: flex; align-items: center; gap: 8px; padding: 7px 10px;
            margin-bottom: 4px; border-radius: 6px; font-size: 12px;
            border: 1px solid var(--border); background: var(--card);
            transition: all .3s ease;
        }
        .topo-node .indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .topo-node .indicator.pending { background: var(--border); }
        .topo-node .indicator.running { background: var(--accent); animation: pulse 1.2s infinite; }
        .topo-node .indicator.done { background: var(--green); }
        .topo-node .indicator.error { background: var(--red); }
        @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(79,143,255,.4); }
            50% { opacity: .5; box-shadow: 0 0 0 4px rgba(79,143,255,0); } }
        .topo-node.running { border-color: rgba(79,143,255,.4); background: rgba(79,143,255,.05); }
        .topo-node.done { border-color: rgba(52,211,153,.3); }
        .topo-node.error { border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.05); }

        /* Stream arrows between stages */
        .topo-arrow { text-align: center; color: var(--text-dim); font-size: 10px;
            padding: 2px 0; margin-bottom: 8px; }

        /* Content */
        .content-panel { flex: 1; overflow-y: auto; padding: 16px 20px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .content-panel .placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-dim); gap: 10px; font-size: 13px;
        }
        .content-panel .placeholder .icon { font-size: 36px; opacity: .3; }

        /* Agent Output Cards */
        .agent-card {
            margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card); overflow: hidden; animation: fadeIn .3s ease;
            border-left: 3px solid var(--border);
        }
        .agent-card.running { border-left-color: var(--accent); }
        .agent-card.done { border-left-color: var(--green); }
        .agent-card.error { border-left-color: var(--red); }

        .agent-card summary { list-style: none; }
        .agent-card summary::-webkit-details-marker { display: none; }

        .agent-card-header {
            display: flex; align-items: center; gap: 10px; padding: 11px 14px;
            cursor: pointer; user-select: none; font-size: 13px; font-weight: 500;
            transition: background .15s;
        }
        .agent-card-header:hover { background: rgba(255,255,255,.03); }

        .status-icon {
            width: 18px; height: 18px; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .status-icon .spinner {
            width: 14px; height: 14px; border: 2px solid rgba(79,143,255,.2);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-icon .check { color: var(--green); font-size: 15px; font-weight: bold; }
        .status-icon .cross { color: var(--red); font-size: 15px; font-weight: bold; }
        .status-icon .pending-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--border);
        }

        .agent-card-header .agent-label { flex: 1; }
        .agent-card-header .metrics {
            display: flex; gap: 8px; font-size: 11px; color: var(--text-dim); font-weight: 400;
        }
        .agent-card-header .metrics .metric-badge {
            padding: 2px 7px; border-radius: 10px; background: rgba(139,143,163,.1);
            white-space: nowrap;
        }
        .agent-card-header .metrics .metric-badge.duration { color: var(--accent); }
        .agent-card-header .metrics .metric-badge.tokens { color: var(--green); }
        .agent-card-header .toggle-arrow {
            font-size: 11px; color: var(--text-dim); transition: transform .25s;
        }
        .agent-card:not([open]) .toggle-arrow { transform: rotate(-90deg); }

        .agent-card-body {
            padding: 10px 14px 14px; border-top: 1px solid var(--border);
            word-break: break-word;
            font-size: 13px; line-height: 1.7; color: var(--text-dim);
            max-height: 500px; overflow-y: auto;
        }
        .agent-card-body:empty { padding: 8px 14px; }
        .agent-card-body:empty::after {
            content: '等待输出...'; color: var(--text-dim); opacity: .4; font-style: italic;
        }
        .agent-card.done .agent-card-body:empty::after { content: '(无输出)'; }

        /* Markdown rendered content */
        .agent-card-body h1, .agent-card-body h2, .agent-card-body h3,
        .agent-card-body h4, .agent-card-body h5, .agent-card-body h6 {
            color: var(--text); margin: 14px 0 6px; font-weight: 600;
        }
        .agent-card-body h1 { font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .agent-card-body h2 { font-size: 16px; }
        .agent-card-body h3 { font-size: 14px; }
        .agent-card-body h4 { font-size: 13px; }
        .agent-card-body p { margin: 6px 0; }
        .agent-card-body strong { color: var(--text); }
        .agent-card-body table {
            width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px;
        }
        .agent-card-body th, .agent-card-body td {
            padding: 6px 10px; border: 1px solid var(--border); text-align: left;
        }
        .agent-card-body th {
            background: rgba(79,143,255,.08); color: var(--text); font-weight: 500;
        }
        .agent-card-body code {
            background: rgba(79,143,255,.1); padding: 1px 5px; border-radius: 3px;
            font-size: 12px; font-family: 'Cascadia Code', 'Fira Code', monospace;
        }
        .agent-card-body pre {
            background: rgba(0,0,0,.3); padding: 10px; border-radius: 6px;
            overflow-x: auto; margin: 8px 0;
        }
        .agent-card-body pre code { background: transparent; padding: 0; }
        .agent-card-body ul, .agent-card-body ol { padding-left: 20px; margin: 6px 0; }
        .agent-card-body li { margin: 3px 0; }
        .agent-card-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
        .agent-card-body blockquote {
            border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0;
            color: var(--text-dim); font-style: italic;
        }
        .agent-card-body a { color: var(--accent); text-decoration: none; }
        .agent-card-body a:hover { text-decoration: underline; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<aside class="sidebar">
    <h2>Agent 面板</h2>
    <div class="agent-item active" data-agent="chat">
        <span class="dot general"></span> 通用助手
        <span class="badge">1 Agent</span>
    </div>
    <div class="agent-item" data-agent="invest">
        <span class="dot invest"></span> 投资分析
        <span class="badge">1 Agent</span>
    </div>
    <div class="agent-item" data-agent="analysis">
        <span class="dot report"></span> 投资研报
        <span class="badge">11 Agent</span>
    </div>
    <div class="footer">
        Spring AI Alibaba 1.1.2<br>Graph Runtime 引擎
    </div>
</aside>

<div class="main">
    <div class="header">
        <h1 id="pageTitle">智能投研多智能体平台</h1>
        <span class="subtitle" id="agentDesc">通用智能助手 — kxhAgent</span>
    </div>

    <div class="input-area">
        <input id="msgInput" type="text" placeholder="输入问题或股票代码，如：贵州茅台 600519" />
        <button class="btn btn-primary" id="sendBtn" onclick="send()">发送</button>
        <button class="btn btn-danger" id="cancelBtn" onclick="cancel()" style="display:none">中断</button>
        <button class="btn btn-outline" onclick="clearAll()">清空</button>
    </div>

    <div class="body-wrap">
        <div class="topo-panel" id="topoPanel">
            <h3 id="topoTitle">Agent 拓扑</h3>
            <div id="topoContent">
                <span style="font-size:12px;color:var(--text-dim)">选择 Agent 类型后发送请求</span>
            </div>
        </div>

        <div class="content-panel" id="content">
            <div class="placeholder">
                <div class="icon">&#9678;</div>
                <div>选择 Agent 类型，输入问题开始对话</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentAgent = 'chat';
    let sseConn = null;
    let currentRequestId = null;
    let agentStates = new Map();
    const agentCardMap = new Map();
    let lastActiveAgent = null;

    const agentConfig = {
        chat: {
            title: '通用助手', desc: 'kxhAgent — 通用智能体',
            endpoint: '/api/v2/agent/chat',
            placeholder: '输入任何问题，如：分析AI行业发展趋势',
            topology: null,
        },
        invest: {
            title: '投资分析', desc: 'InvestAgent — 财务/估值/行情',
            endpoint: '/api/v2/agent/invest',
            placeholder: '输入股票名称或代码，如：分析贵州茅台 600519',
            topology: null,
        },
        analysis: {
            title: '投资研报 — 11 Agent 流水线', desc: '数据采集 → 8Agent并行分析 → 投资建议 → 研报生成',
            endpoint: '/api/v2/agent/invest/analysis',
            placeholder: '输入股票代码，如：生成贵州茅台 600519 投资研报',
            topology: {
                stages: [
                    { label: 'Stage 1 — 数据采集', agents: ['数据采集Agent'] },
                    {
                        label: 'Stage 2 — 8 维度并行分析',
                        agents: [
                            '商业模式Agent', '行业分析Agent', '杜邦分析Agent',
                            '盈利能力Agent', '成长性分析Agent', '现金流分析Agent',
                            '估值分析Agent', '风险识别Agent',
                        ],
                    },
                    { label: 'Stage 3 — 投资建议', agents: ['投资建议Agent'] },
                    { label: 'Stage 4 — 研报生成', agents: ['研报生成Agent'] },
                ],
            },
        }
    };

    // ---- Sidebar ----
    document.querySelectorAll('.agent-item').forEach(el => {
        el.addEventListener('click', () => {
            document.querySelectorAll('.agent-item').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            currentAgent = el.dataset.agent;
            const cfg = agentConfig[currentAgent];
            document.getElementById('pageTitle').textContent = cfg.title;
            document.getElementById('agentDesc').textContent = cfg.desc;
            document.getElementById('msgInput').placeholder = cfg.placeholder;
            clearAll();
        });
    });

    document.getElementById('msgInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') send();
    });

    // ---- Send / SSE ----
    function send() {
        const input = document.getElementById('msgInput');
        const msg = input.value.trim();
        if (!msg) return;

        if (sseConn) { sseConn.close(); sseConn = null; }

        const btn = document.getElementById('sendBtn');
        btn.disabled = true; btn.textContent = '运行中...';
        document.getElementById('cancelBtn').style.display = 'inline-block';

        document.getElementById('content').innerHTML = '';
        agentStates = new Map();
        agentCardMap.clear();
        lastActiveAgent = null;

        const cfg = agentConfig[currentAgent];
        currentRequestId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
        renderTopology(cfg.topology);

        const url = cfg.endpoint + '?message=' + encodeURIComponent(msg);
        const es = new EventSource(url);
        sseConn = es;

        es.addEventListener('progress', e => {
            const p = JSON.parse(e.data);
            if (!p.agentName) return;

            if (p.type === 'agent_start') {
                agentStates.set(p.agentName, 'running');
                ensureAgentCard(p.agentName, 'running');
                lastActiveAgent = p.agentName;
            } else if (p.type === 'agent_done') {
                agentStates.set(p.agentName, 'done');
                updateCardStatus(p.agentName, 'done');
                updateCardMetrics(p.agentName, p.durationMs, p.totalTokens);
                collapseCard(p.agentName);
                lastActiveAgent = findRunningAgent();
            } else if (p.type === 'agent_error') {
                agentStates.set(p.agentName, 'error');
                updateCardStatus(p.agentName, 'error');
                lastActiveAgent = findRunningAgent();
            } else if (p.type === 'agent_message' && p.content) {
                ensureAgentCard(p.agentName, agentStates.get(p.agentName) || 'running');
                appendToCard(p.agentName, p.content);
            } else if (p.type === 'progress' && p.content) {
                ensureAgentCard(p.agentName, 'running');
                appendToCard(p.agentName, p.content + '\n');
            }

            updateTopologyNodes(cfg.topology);
        });

        es.addEventListener('message', e => {
            if (e.data === '[DONE]') return;
            const target = lastActiveAgent || '_output';
            ensureAgentCard(target, agentStates.get(target) || 'running');
            appendToCard(target, e.data);
        });

        es.addEventListener('done', () => {
            finishRequest();
        });

        es.addEventListener('error', e => {
            let errMsg = '连接异常';
            try { if (e.data) errMsg = e.data; } catch (_) {}
            if (lastActiveAgent) {
                appendToCard(lastActiveAgent, '\nERROR: ' + errMsg);
                updateCardStatus(lastActiveAgent, 'error');
            }
            finishRequest();
        });

        es.onerror = () => {};
    }

    function cancel() {
        if (sseConn) { sseConn.close(); sseConn = null; }
        if (currentRequestId) {
            fetch('/api/v2/agent/cancel?requestId=' + encodeURIComponent(currentRequestId))
                .catch(() => {});
        }
        finishRequest();
    }

    function finishRequest() {
        if (sseConn) { sseConn.close(); sseConn = null; }
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('sendBtn').textContent = '发送';
        document.getElementById('cancelBtn').style.display = 'none';
        currentRequestId = null;
        lastActiveAgent = null;
        for (const [name, state] of agentStates) {
            if (state === 'running') {
                agentStates.set(name, 'done');
                updateCardStatus(name, 'done');
            }
        }
    }

    function clearAll() {
        if (sseConn) { sseConn.close(); sseConn = null; }
        document.getElementById('content').innerHTML =
            '<div class="placeholder"><div class="icon">&#9678;</div><div>选择 Agent 类型，输入问题开始对话</div></div>';
        document.getElementById('topoContent').innerHTML =
            '<span style="font-size:12px;color:var(--text-dim)">选择 Agent 类型后发送请求</span>';
        agentStates = new Map();
        agentCardMap.clear();
        lastActiveAgent = null;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('sendBtn').textContent = '发送';
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('msgInput').value = '';
        currentRequestId = null;
    }

    // ---- Agent Cards ----
    function statusHtml(status) {
        if (status === 'running') return '<span class="spinner"></span>';
        if (status === 'done') return '<span class="check">✓</span>';
        if (status === 'error') return '<span class="cross">✗</span>';
        return '<span class="pending-dot"></span>';
    }

    function ensureAgentCard(name, status) {
        if (agentCardMap.has(name)) return;

        const content = document.getElementById('content');
        const details = document.createElement('details');
        details.className = 'agent-card ' + (status || 'running');
        details.open = true;
        details.dataset.agent = name;

        const summary = document.createElement('summary');
        summary.className = 'agent-card-header';
        summary.innerHTML =
            '<span class="status-icon">' + statusHtml(status) + '</span>' +
            '<span class="agent-label">' + name + '</span>' +
            '<span class="metrics"></span>' +
            '<span class="toggle-arrow">▾</span>';

        const body = document.createElement('div');
        body.className = 'agent-card-body';

        details.appendChild(summary);
        details.appendChild(body);
        content.appendChild(details);

        agentCardMap.set(name, { el: details, body: body, summary: summary, rawText: '' });
        content.scrollTop = content.scrollHeight;
    }

    function appendToCard(name, text) {
        const card = agentCardMap.get(name);
        if (!card) return;
        card.rawText += text;
        renderCardContent(card);
        var content = document.getElementById('content');
        content.scrollTop = content.scrollHeight;
    }

    function renderCardContent(card) {
        if (typeof marked !== 'undefined' && marked.parse) {
            try {
                card.body.innerHTML = marked.parse(card.rawText);
            } catch (e) {
                card.body.textContent = card.rawText;
            }
        } else {
            card.body.textContent = card.rawText;
        }
    }

    function updateCardStatus(name, status) {
        const card = agentCardMap.get(name);
        if (!card) return;
        card.el.className = 'agent-card ' + status;
        card.summary.querySelector('.status-icon').innerHTML = statusHtml(status);
    }

    function updateCardMetrics(name, durationMs, totalTokens) {
        const card = agentCardMap.get(name);
        if (!card) return;
        const metricsEl = card.summary.querySelector('.metrics');
        if (!metricsEl) return;
        let html = '';
        if (durationMs != null) {
            var sec = (durationMs / 1000).toFixed(1);
            html += '<span class="metric-badge duration">' + sec + 's</span>';
        }
        if (totalTokens != null) {
            html += '<span class="metric-badge tokens">' + totalTokens + ' tokens</span>';
        }
        metricsEl.innerHTML = html;
    }

    function collapseCard(name) {
        const card = agentCardMap.get(name);
        if (!card || agentCardMap.size <= 1) return;
        setTimeout(function() {
            if (card.el.dataset.agent === name) {
                card.el.open = false;
            }
        }, 600);
    }

    function findRunningAgent() {
        for (const [name, state] of agentStates) {
            if (state === 'running') return name;
        }
        return null;
    }

    // ---- Topology Rendering ----
    function renderTopology(topo) {
        const panel = document.getElementById('topoContent');
        if (!topo) {
            panel.innerHTML = renderSingleAgentNode('kxhAgent');
            return;
        }

        let html = '';
        topo.stages.forEach((stage, si) => {
            html += '<div class="topo-stage">';
            html += '<div class="topo-stage-label">' + stage.label + '</div>';
            stage.agents.forEach(name => {
                html += '<div class="topo-node" data-agent="' + name + '">';
                html += '<span class="indicator pending"></span>';
                html += '<span class="node-name">' + name + '</span>';
                html += '</div>';
            });
            html += '</div>';
            if (si < topo.stages.length - 1) {
                html += '<div class="topo-arrow">↓</div>';
            }
        });
        panel.innerHTML = html;
    }

    function renderSingleAgentNode(name) {
        if (currentAgent === 'invest') name = 'InvestAgent';
        return '<div class="topo-node" data-agent="' + name + '">' +
            '<span class="indicator pending"></span>' +
            '<span class="node-name">' + name + '</span></div>';
    }

    function updateTopologyNodes(topo) {
        const names = [];
        if (topo) {
            topo.stages.forEach(s => s.agents.forEach(a => names.push(a)));
        } else {
            names.push(currentAgent === 'invest' ? 'InvestAgent' : 'kxhAgent');
        }
        names.forEach(name => {
            const node = document.querySelector('.topo-node[data-agent="' + name + '"]');
            if (!node) return;
            const state = agentStates.get(name) || 'pending';
            const indicator = node.querySelector('.indicator');
            indicator.className = 'indicator ' + state;
            node.className = 'topo-node ' + state;
        });
    }
</script>
</body>
</html>
