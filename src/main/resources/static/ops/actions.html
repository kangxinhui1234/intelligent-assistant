<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AIOps · HITL 待审批动作</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#f6f8fa; --fg:#24292f; --muted:#6e7781; --border:#d0d7de;
          --green:#1f883d; --red:#cf222e; --blue:#0969da; --yellow:#bf8700; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
         background:var(--bg); color:var(--fg) }
  header { background:#fff; border-bottom:1px solid var(--border); padding:14px 24px;
           display:flex; align-items:center; justify-content:space-between }
  header h1 { font-size:18px; margin:0 }
  header .filters { display:flex; gap:8px; align-items:center }
  header select, header button {
    padding:6px 12px; border:1px solid var(--border); border-radius:6px;
    background:#fff; color:var(--fg); font-size:13px; cursor:pointer
  }
  header button.refresh { background:#fff }
  main { padding:20px 24px; max-width:1280px; margin:0 auto }
  table { width:100%; border-collapse:collapse; background:#fff;
          border:1px solid var(--border); border-radius:8px; overflow:hidden }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top }
  th { background:#f6f8fa; font-weight:600; color:var(--muted); font-size:12px;
       text-transform:uppercase; letter-spacing:.5px }
  tr:last-child td { border-bottom:none }
  td.id { font-family:Menlo,monospace; color:var(--muted) }
  td.actionType { font-weight:600 }
  td.rationale { max-width:380px; color:#444 }
  td.payload code { background:#f6f8fa; padding:2px 6px; border-radius:4px; font-size:12px }
  span.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600 }
  .b-PENDING  { background:#fff8c5; color:var(--yellow) }
  .b-APPROVED { background:#dafbe1; color:var(--green) }
  .b-EXECUTED { background:#d4ecff; color:var(--blue) }
  .b-REJECTED { background:#ffebe9; color:var(--red) }
  .b-FAILED   { background:#ffebe9; color:var(--red) }
  .actions { white-space:nowrap }
  button.approve, button.reject {
    padding:5px 12px; border:none; border-radius:6px; font-size:12px; cursor:pointer; margin-right:6px
  }
  button.approve { background:var(--green); color:#fff }
  button.reject  { background:var(--red); color:#fff }
  button[disabled] { opacity:.4; cursor:not-allowed }
  details { background:#fff; padding:8px 12px; border-radius:4px }
  details summary { cursor:pointer; color:var(--muted) }
  .empty { padding:40px; text-align:center; color:var(--muted); background:#fff;
           border:1px solid var(--border); border-radius:8px }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
           background:#24292f; color:#fff; padding:10px 20px; border-radius:6px;
           opacity:0; transition:opacity .2s; pointer-events:none; font-size:13px }
  #toast.show { opacity:1 }
</style>
</head>
<body>
<header>
  <h1>🤖 AIOps · HITL 待审批动作</h1>
  <div class="filters">
    <a href="knowledge.html" style="color:#0969da;text-decoration:none;font-size:13px;margin-right:8px">📚 知识库</a>
    <select id="filter">
      <option value="PENDING">仅 PENDING</option>
      <option value="">全部</option>
      <option value="APPROVED">APPROVED</option>
      <option value="EXECUTED">EXECUTED</option>
      <option value="REJECTED">REJECTED</option>
      <option value="FAILED">FAILED</option>
    </select>
    <button class="refresh" onclick="load()">刷新</button>
  </div>
</header>

<main id="content">
  <div class="empty">加载中…</div>
</main>

<div id="toast"></div>

<script>
const API = location.pathname.startsWith('/api') ? '/api' : '';

async function load() {
  const status = document.getElementById('filter').value;
  const url = `${API}/ops/actions?size=50` + (status ? `&status=${status}` : '');
  try {
    const r = await fetch(url);
    const data = await r.json();
    render(data.records || []);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="empty">加载失败: ${e.message}</div>`;
  }
}

function render(rows) {
  const root = document.getElementById('content');
  if (!rows.length) {
    root.innerHTML = `<div class="empty">没有匹配的动作</div>`;
    return;
  }
  const rowsHtml = rows.map(r => `
    <tr>
      <td class="id">#${r.id}</td>
      <td><span class="badge b-${r.status}">${r.status}</span></td>
      <td class="actionType">${r.actionType}</td>
      <td>${esc(r.target || '-')}</td>
      <td class="payload"><code>${esc(short(r.proposalPayload, 80))}</code></td>
      <td class="rationale">
        <details><summary>${esc(short(r.rationale, 60))}</summary>
          <div style="margin-top:8px;color:#444;white-space:pre-wrap">${esc(r.rationale || '-')}</div>
        </details>
      </td>
      <td>
        <div style="font-size:12px;color:#888">incident:</div>
        <div style="font-family:Menlo,monospace;font-size:11px">${esc(r.incidentId)}</div>
      </td>
      <td style="font-size:12px;color:#888">
        ${fmt(r.triggeredAt)}
        ${r.confirmedAt ? `<br/>确认: ${fmt(r.confirmedAt)}` : ''}
        ${r.executedAt  ? `<br/>执行: ${fmt(r.executedAt)}`  : ''}
      </td>
      <td class="actions">
        ${r.status === 'PENDING' ? `
          <button class="approve" onclick="act(${r.id}, '${r.approveToken}', 'approve')">批准</button>
          <button class="reject"  onclick="act(${r.id}, '${r.approveToken}', 'reject')">驳回</button>
        ` : `<span style="color:#888;font-size:12px">${esc(short(r.resultMessage, 80) || '-')}</span>`}
      </td>
    </tr>
  `).join('');
  root.innerHTML = `
    <table>
      <thead><tr>
        <th>#</th><th>状态</th><th>类型</th><th>目标</th><th>参数</th>
        <th>理由</th><th>关联事故</th><th>时间</th><th>操作</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

async function act(id, token, op) {
  if (!confirm(`确定${op === 'approve' ? '批准' : '驳回'} Action #${id}?`)) return;
  const operator = prompt('操作人(留空=anonymous):', '') || 'anonymous';
  const url = `${API}/ops/actions/${id}/${op}?token=${encodeURIComponent(token)}&operator=${encodeURIComponent(operator)}`;
  try {
    const r = await fetch(url, { method: 'POST' });
    const data = await r.json();
    toast((data.ok ? '✅ ' : '⚠️ ') + (data.message || JSON.stringify(data)));
    setTimeout(load, 600);
  } catch (e) {
    toast('⚠️ 调用失败: ' + e.message);
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function short(s, n) {
  if (s == null) return '';
  s = String(s);
  return s.length > n ? s.slice(0, n) + '…' : s;
}
function fmt(t) {
  if (!t) return '';
  return String(t).replace('T', ' ').slice(0, 19);
}

document.getElementById('filter').addEventListener('change', load);
load();
setInterval(load, 15000);   // 15s 自动刷新
</script>
</body>
</html>
