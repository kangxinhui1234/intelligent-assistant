spring:
  autoconfigure:
    exclude:
      # 保留 ES 排除 (项目用 Milvus, 不用 ES)
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      # 保留 JPA 排除 (项目用 MyBatis-Plus,不用 JPA)
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      # 注: 之前排除的 DataSource / MybatisPlus auto-config 已恢复,因为 AIOps 模块需要 MySQL 持久化
  ai:
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        database-name: default
        collection-name: pdf_docs
        embedding-dimension: 1536
        initialize-schema: true
